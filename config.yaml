# Core Pipeline Configuration
#
# Primary Application Settings
#
# The `filters` block establishes deterministic exclusion criteria to minimize LLM inference overhead.
# By aggressively pre-filtering roles based on regex patterns, the pipeline achieves substantial
# cost reductions (e.g., pruning 2,000 raw postings down to 40 candidates) before LLM scoring begins.

filters:
  # Title Inclusion Patterns
  # Regular expressions evaluated against the job title (case-insensitive).
  # A posting is retained if its title matches at least one inclusion pattern AND zero exclusion patterns.
  # Note: Use word boundaries (\b) to isolate specific acronyms (e.g., \bsde\b).

  include_titles:
    # --- Software / Backend / Systems Engineering ---
    - '\b(software|backend|back-end|server|platform|infrastructure|infra|systems|distributed|cloud)\b.*\bengineer\b'
    - '\bengineer\b.*\b(backend|back-end|platform|infrastructure|infra|systems|distributed)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'software engineer'
    - 'site reliability engineer'
    - '\bsre\b'
    - 'member of technical staff'
    # --- Systems / Networking track (DPI Engine, VectorDB background) ---
    - '\bnetwork(ing)?\s+(software\s+)?engineer\b'
    - '\b(kernel|embedded|firmware|driver|packet|dataplane|data plane)\b.*\bengineer\b'
    - '\bengineer\b.*\b(kernel|packet|dataplane|networking|performance)\b'
    - '\bperformance engineer\b'
    - '\bsystems engineer\b'
    - '\bc\+\+\b.*\bengineer\b'
    - '\bengineer\b.*\bc\+\+\b'
    # --- Python / Data Science / ML track (NIELIT training, AWS ML cert) ---
    - '\bpython\b.*\b(developer|engineer)\b'
    - '\b(developer|engineer)\b.*\bpython\b'
    - '\bdata\s+(scientist|analyst|engineer)\b'
    - '\bmachine\s+learning\b.*\b(engineer|developer)\b'
    - '\b(ml|ai)\b.*\b(engineer|developer)\b'
    - '\bengineer\b.*\b(ml|ai|machine learning)\b'
    - '\bdata\s+science\b'
    # --- Entry-Level / Internship Classifications ---
    - '\bintern\b'
    - '\btrainee\b'
    - '\bapprentice\b'

  # Title Exclusion Patterns
  # Postings matching any of these patterns will be immediately discarded, superseding any inclusion matches.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'      # Exceeds target seniority threshold
    - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    # Note: data scientist / ML scientist are NOT excluded — they match
    # Shashank's ML/DS training, certifications, and NIELIT capstone.

  # Location Constraints
  # Substrings evaluated against the combined string "<location> <title>" (case-insensitive).
  # Leaving this array empty bypasses location filtering.
  locations:
    - bangalore
    - bengaluru
    - hyderabad
    - gurugram
    - noida
    - mumbai
    - delhi
    - lucknow
    - kolkata
    - pune
    - india

  # If enabled, roles explicitly designated as "remote" will bypass standard location constraints.
  allow_remote: true

  # Maximum Age Threshold
  # Discards postings older than the specified duration in days. Set to null to disable.
  # Note: This is a best-effort metric as ATS platforms frequently update timestamps arbitrarily.
  max_age_days: 30

# --- LLM Processing Settings --------------------------------------------------
screen_batch_size: 8      # Concurrent job evaluations per screening inference.
screen_jd_chars: 1400     # Maximum character length for job descriptions during the screening phase.
draft_jd_chars: 6000      # Maximum character length for job descriptions during the drafting phase.
score_threshold: 7.0      # Minimum evaluation score required to trigger draft generation and digest inclusion.
max_per_digest: 5         # Maximum limit for drafting API calls per execution cycle.

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
