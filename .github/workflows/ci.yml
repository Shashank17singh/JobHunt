name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff pytest
    - name: Run lint
      run: ruff check .
    - name: Run tests
      run: |
        if [ -d tests ] || ls test_*.py 1> /dev/null 2>&1; then pytest; else echo 'No tests found, skipping'; fi

